const STORAGE_KEY = 'appunto-transfer-progress:' + PAYLOAD.payloadSha256;
const BATCH_SIZE = 10;
const BATCH_DELAY_MS = 220;
const groupsRoot = document.getElementById('groups');
const summaryEl = document.getElementById('summary');
const toastEl = document.getElementById('toast');
let busy = false;
let done = PAYLOAD.groups.map(() => new Set());

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  if (Array.isArray(saved) && saved.length === PAYLOAD.groups.length) {
    done = saved.map((xs, i) => new Set((Array.isArray(xs) ? xs : []).filter((x) => Number.isInteger(x) && x >= 0 && x < PAYLOAD.groups[i].parts.length)));
  }
} catch {}

function esc(s){return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtBytes(n){return n < 1024*1024 ? (n/1024).toFixed(1)+' KB' : (n/1024/1024).toFixed(2)+' MB';}
function save(){localStorage.setItem(STORAGE_KEY, JSON.stringify(done.map((s)=>Array.from(s).sort((a,b)=>a-b))));}
let toastTimer;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2600);}
function nextIdx(gi){for(let i=0;i<PAYLOAD.groups[gi].parts.length;i++) if(!done[gi].has(i)) return i; return -1;}
function buildDom(){
  const totalParts = PAYLOAD.groups.reduce((s,g)=>s+g.parts.length,0);
  const totalBytes = PAYLOAD.groups.reduce((s,g)=>s+g.size,0);
  summaryEl.innerHTML = 'generated ' + esc(PAYLOAD.generatedAt) + '<br>' + PAYLOAD.groups.length + ' groups · ' + totalParts + ' parts · archive ' + fmtBytes(totalBytes) + '<br>payload ' + esc(PAYLOAD.payloadSha256);
  groupsRoot.innerHTML = '';
  PAYLOAD.groups.forEach((g,gi)=>{
    const div=document.createElement('div'); div.className='group'; div.dataset.gi=gi;
    let chips='';
    for(let pi=0;pi<g.parts.length;pi++) chips += '<button class="chip" data-gi="'+gi+'" data-pi="'+pi+'">'+(pi+1)+'</button>';
    div.innerHTML =
      '<h2><span class="kind">'+esc(g.fileName)+'</span><span class="count">'+g.parts.length+' parts</span></h2>'+
      '<div class="counter"></div><div class="progress"><div></div></div>'+
      '<div class="actions"><button class="primary" data-next="'+gi+'">다음 1개 복사</button><button class="secondary" data-batch="'+gi+'">다음 '+BATCH_SIZE+'개 자동 복사</button></div>'+
      '<div class="chips">'+chips+'</div>'+
      '<div class="meta">archive '+fmtBytes(g.size)+' · text '+fmtBytes(g.textBytes)+'<br>sha256 '+esc(g.sha256)+'</div>';
    groupsRoot.appendChild(div);
  });
}
function update(copying){
  PAYLOAD.groups.forEach((g,gi)=>{
    const div=groupsRoot.querySelector('.group[data-gi="'+gi+'"]'); if(!div) return;
    const total=g.parts.length, doneCount=done[gi].size, next=nextIdx(gi);
    div.querySelector('.counter').textContent = doneCount+' / '+total+' 파트'+(doneCount>=total?' — 완료':'');
    div.querySelector('.progress > div').style.width = total ? (doneCount/total*100).toFixed(2)+'%' : '0%';
    div.querySelector('[data-next]').disabled = busy || next < 0;
    div.querySelector('[data-batch]').disabled = busy || next < 0;
    div.querySelectorAll('.chip').forEach((c,pi)=>{
      c.disabled = busy;
      c.classList.toggle('done', done[gi].has(pi));
      c.classList.toggle('next', pi===next);
      c.classList.toggle('copying', !!(copying && copying.gi===gi && copying.pi===pi));
    });
  });
  document.getElementById('reset').disabled = busy;
}
async function copyPart(gi,pi){
  update({gi,pi});
  await navigator.clipboard.writeText(PAYLOAD.groups[gi].parts[pi]);
  done[gi].add(pi); save(); update();
  toast(PAYLOAD.groups[gi].kind+' '+(pi+1)+'/'+PAYLOAD.groups[gi].parts.length+' 복사됨');
}
async function copySingle(gi,pi){
  if(busy) return; busy=true;
  try { await copyPart(gi,pi); }
  catch(err){ toast('실패: '+(err && err.message ? err.message : err)); }
  finally{ busy=false; update(); }
}
async function copyNextBatch(gi){
  if(busy) return; busy=true;
  try {
    let count=0;
    while(count < BATCH_SIZE){
      const pi=nextIdx(gi); if(pi < 0) break;
      await copyPart(gi,pi); count++;
      if(count < BATCH_SIZE && nextIdx(gi) >= 0) await new Promise(r=>setTimeout(r,BATCH_DELAY_MS));
    }
    toast(PAYLOAD.groups[gi].kind+' '+count+'개 복사 완료');
  } catch(err) { toast('실패: '+(err && err.message ? err.message : err)); }
  finally { busy=false; update(); }
}
document.addEventListener('click',(e)=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.id==='reset') { if(busy) return; done=PAYLOAD.groups.map(()=>new Set()); save(); update(); toast('전체 리셋'); return; }
  if(t.dataset.next !== undefined) { const gi=+t.dataset.next; const pi=nextIdx(gi); if(pi>=0) copySingle(gi,pi); return; }
  if(t.dataset.batch !== undefined) { copyNextBatch(+t.dataset.batch); return; }
  if(t.classList.contains('chip')) copySingle(+t.dataset.gi,+t.dataset.pi);
});
buildDom(); update();
</script>
